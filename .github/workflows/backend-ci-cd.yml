name: Backend CI/CD Pipeline

on:
  repository_dispatch:
    types: [backend-deployment]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: dev
        type: choice
        options:
          - testing
          - dev
          - staging
          - prod
      services:
        description: 'Services to deploy (JSON array)'
        required: false
        default: '["auth-service", "event-service", "notification-service", "payment-service"]'
        type: string

env:
  ENVIRONMENT: "${{ github.event.client_payload.environment || inputs.environment }}"
  BACKEND_REPO: "${{ github.event.client_payload.repository || 'AmaliTech-Training-Academy/gep-backend' }}"
  COMMIT_SHA: "${{ github.event.client_payload.sha || github.sha }}"
  AWS_REGION: eu-west-1
  ECS_CLUSTER: "event-planner-${{ github.event.client_payload.environment || inputs.environment }}-cluster"

jobs:
  check-branch:
    runs-on: [self-hosted, backend]
    outputs:
      should-deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Branch
        id: check
        run: |
          BRANCH="${{ github.event.client_payload.ref || 'dev' }}"
          if [[ "$BRANCH" == "refs/heads/dev" || "$BRANCH" == "dev" || "$BRANCH" == "refs/heads/testing" || "$BRANCH" == "testing" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Skipping deployment - branch '$BRANCH' is not allowed"
          fi

  prepare:
    needs: check-branch
    if: needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    outputs:
      services: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Determine Services
        id: services
        run: |
          SERVICES='${{ github.event.client_payload.services || inputs.services || '["auth-service", "event-service", "notification-service", "payment-service"]' }}'
          ENABLED=("auth-service" "event-service" "notification-service" "payment-service")
          FILTERED=()
          
          for service in $(echo $SERVICES | jq -r '.[]'); do
            [[ " ${ENABLED[*]} " =~ " $service " ]] && FILTERED+=("\"$service\"")
          done
          
          [ ${#FILTERED[@]} -eq 0 ] && FILTERED=("\"auth-service\"" "\"event-service\"" "\"notification-service\"" "\"payment-service\"")
          
          echo "matrix=[$(IFS=,; echo "${FILTERED[*]}")]" >> "$GITHUB_OUTPUT"

  build-common:
    needs: [check-branch, prepare]
    if: needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-backend
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.COMMIT_SHA }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: ./.github/actions/setup-maven

      - name: Build Common
        working-directory: backend
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export MAVEN_OPTS="-Dmaven.repo.local=$HOME/.m2/repository -Xmx1024m"
          
          [ -f "pom.xml" ] && mvn clean install -N -U -DskipTests --batch-mode
          
          if [ -d "common-libraries" ]; then
            cd common-libraries && mvn clean install -U -DskipTests --batch-mode
          elif [ -d "services/common-libraries" ]; then
            cd services/common-libraries && mvn clean install -U -DskipTests --batch-mode
          fi

  build-and-test:
    needs: [check-branch, prepare, build-common]
    if: needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-backend
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.COMMIT_SHA }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: ./.github/actions/setup-maven

      - uses: ./.github/actions/build-maven
        with:
          service: ${{ matrix.service }}

      - name: Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/services/${{ matrix.service }}'

  build-and-push:
    needs: [check-branch, prepare, build-and-test]
    if: needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-backend
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.COMMIT_SHA }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: ./.github/actions/aws-configure
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: ./.github/actions/docker-build-push
        with:
          service: ${{ matrix.service }}
          environment: ${{ env.ENVIRONMENT }}
          commit-sha: ${{ env.COMMIT_SHA }}
          ecr-registry: ${{ steps.login-ecr.outputs.registry }}

  deploy-to-ecs:
    needs: [check-branch, prepare, build-and-push]
    if: needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/aws-configure
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/ecs-deploy
        with:
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          region: ${{ env.AWS_REGION }}

  notify:
    needs: [check-branch, prepare, deploy-to-ecs]
    if: always() && needs.check-branch.outputs.should-deploy == 'true'
    runs-on: [self-hosted, backend]
    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: custom
          custom_payload: |
            {
              "text": "Backend Deployment Status",
              "attachments": [{
                "color": "${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}",
                "fields": [
                  {"title": "Status", "value": "${{ contains(needs.*.result, 'failure') && 'Failed' || 'Succeeded' }}", "short": true},
                  {"title": "Environment", "value": "${{ env.ENVIRONMENT }}", "short": true},
                  {"title": "Commit SHA", "value": "${{ env.COMMIT_SHA }}", "short": true}
                ]
              }]
            }
