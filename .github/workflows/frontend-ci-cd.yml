name: Frontend CI/CD Pipeline

on:
  repository_dispatch:
    types: [frontend-deployment]
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
  FRONTEND_REPO: ${{ github.event.client_payload.repository || 'AmaliTech-Training-Academy/event-planner-frontend' }}
  COMMIT_SHA: ${{ github.event.client_payload.sha || github.sha }}

jobs:
  security-scan:
    runs-on: [self-hosted, frontend]
    steps:
    - name: Checkout Frontend Code
      uses: actions/checkout@v4
      with:
        repository: ${{ env.FRONTEND_REPO }}
        ref: ${{ env.COMMIT_SHA }}
        token: ${{ secrets.FRONTEND_REPO_TOKEN }}
        path: frontend

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      working-directory: frontend
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi

    - name: Dependency Vulnerability Scan
      working-directory: frontend
      run: |
        npm audit --audit-level=moderate --json > audit-results.json || true
        VULN_COUNT=$(jq '.metadata.vulnerabilities.total' audit-results.json 2>/dev/null || echo "0")
        echo "Found $VULN_COUNT vulnerabilities"
        if [ "$VULN_COUNT" -gt 0 ]; then
          npm audit --audit-level=moderate
        fi

    - name: Secrets Detection
      uses: trufflesecurity/trufflehog@main
      with:
        path: frontend/
        base: main
        head: HEAD
        extra_args: --only-verified

    - name: SAST Scan
      uses: semgrep/semgrep-action@v1
      with:
        config: p/security-audit p/javascript p/typescript p/react
        generateSarif: "1"
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    # - name: License Check
    #   working-directory: frontend
    #   run: |
    #     npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD' --json > license-report.json || true
    #     if npx license-checker --failOn 'GPL;AGPL;LGPL' --summary; then
    #       echo "License check passed"
    #     else
    #       echo "::error::Restricted licenses found"
    #       exit 1
    #     fi

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ env.ENVIRONMENT }}
        path: |
          frontend/audit-results.json
          results.sarif

  build-and-test:
    needs: security-scan
    runs-on: [self-hosted, frontend]
    steps:
    - name: Checkout Frontend Code
      uses: actions/checkout@v4
      with:
        repository: ${{ env.FRONTEND_REPO }}
        ref: ${{ env.COMMIT_SHA }}
        token: ${{ secrets.FRONTEND_REPO_TOKEN }}
        path: frontend

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install and Build
      working-directory: frontend
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi
        
        if npm run | grep -q "build:${{ env.ENVIRONMENT }}"; then
          npm run build:${{ env.ENVIRONMENT }}
        else
          npm run build
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ env.ENVIRONMENT }}
        path: frontend/dist/

  deploy-to-s3:
    needs: build-and-test
    runs-on: [self-hosted, frontend]
    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ env.ENVIRONMENT }}
        path: dist/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3
      run: |
        case "${{ env.ENVIRONMENT }}" in
          dev) BUCKET="${{ secrets.S3_BUCKET_DEV }}" ;;
          staging) BUCKET="${{ secrets.S3_BUCKET_STAGING }}" ;;
          prod) BUCKET="${{ secrets.S3_BUCKET_PROD }}" ;;
        esac
        
        if [ -z "$BUCKET" ]; then
          echo "::error::S3 bucket not configured for environment ${{ env.ENVIRONMENT }}"
          exit 1
        fi
        
        aws s3 sync dist/ s3://$BUCKET --delete

    - name: Invalidate CloudFront
      run: |
        case "${{ env.ENVIRONMENT }}" in
          dev) DISTRIBUTION="${{ secrets.CLOUDFRONT_DISTRIBUTION_DEV }}" ;;
          staging) DISTRIBUTION="${{ secrets.CLOUDFRONT_DISTRIBUTION_STAGING }}" ;;
          prod) DISTRIBUTION="${{ secrets.CLOUDFRONT_DISTRIBUTION_PROD }}" ;;
        esac
        
        if [ -z "$DISTRIBUTION" ]; then
          echo "::error::CloudFront distribution not configured for environment ${{ env.ENVIRONMENT }}"
          exit 1
        fi
        
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION --paths "/*"

  notify:
    needs: [security-scan, build-and-test, deploy-to-s3]
    if: always()
    runs-on: [self-hosted, frontend]
    steps:
    - name: Security Summary
      if: always()
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan Status:** ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY

    - name: Slack Notification
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        status: custom
        custom_payload: |
          {
            "text": "Frontend Deployment ${{ contains(needs.*.result, 'failure') && 'Failed ❌' || 'Succeeded ✅' }}",
            "attachments": [{
              "color": "${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}",
              "fields": [
                {
                  "title": "Environment",
                  "value": "${{ env.ENVIRONMENT }}",
                  "short": true
                },
                {
                  "title": "Repository",
                  "value": "event-planner-frontend",
                  "short": true
                },
                {
                  "title": "Security Scan",
                  "value": "${{ needs.security-scan.result }}",
                  "short": true
                },
                {
                  "title": "Triggered By",
                  "value": "${{ github.actor }}",
                  "short": true
                }
              ]
            }]
          }