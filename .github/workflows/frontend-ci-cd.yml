name: Frontend CI/CD Pipeline

on:
  repository_dispatch:
    types: [frontend-deployment]
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
  FRONTEND_REPO: ${{ github.event.client_payload.repository || 'AmaliTech-Training-Academy/event-planner-frontend' }}
  COMMIT_SHA: ${{ github.event.client_payload.sha || 'dev' }}

jobs:
  security-scan:
    runs-on: [self-hosted, frontend]
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/checkout-frontend
      with:
        repository: ${{ env.FRONTEND_REPO }}
        ref: ${{ env.COMMIT_SHA }}
        token: ${{ secrets.FRONTEND_REPO_TOKEN }}

    - uses: ./.github/actions/setup-node

    - name: Dependency Vulnerability Scan
      working-directory: frontend
      run: |
        npm audit --audit-level=moderate --json > audit-results.json || true
        VULN_COUNT=$(jq '.metadata.vulnerabilities.total' audit-results.json 2>/dev/null || echo "0")
        echo "Found $VULN_COUNT vulnerabilities"
        [ "$VULN_COUNT" -gt 0 ] && npm audit --audit-level=moderate || true

    - name: Secrets Detection
      working-directory: frontend
      run: |
        SECRETS_FOUND=0
        grep -rn "AKIA[0-9A-Z]\{16\}" . --exclude-dir=node_modules --exclude="*.json" --exclude="*.lock" && SECRETS_FOUND=1 || true
        grep -rn "eyJ[A-Za-z0-9-_=]\+\.[A-Za-z0-9-_=]\+\.\?[A-Za-z0-9-_.+/=]*" . --exclude-dir=node_modules --exclude="*.json" --exclude="*.lock" && SECRETS_FOUND=1 || true
        grep -rin "api[_-]\?key.*['\"][0-9a-zA-Z]\{16,\}['\"]" . --exclude-dir=node_modules --exclude="*.json" --exclude="*.lock" && SECRETS_FOUND=1 || true
        grep -rn "BEGIN.*PRIVATE.*KEY" . --exclude-dir=node_modules && SECRETS_FOUND=1 || true
        [ $SECRETS_FOUND -eq 0 ] && echo "✅ No secrets detected" || echo "❌ Secrets found"

    - name: Linting
      working-directory: frontend
      run: npm run | grep -q "lint" && npm run lint || echo "No lint script found"

    - name: License Check
      working-directory: frontend
      run: |
        npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD' --json > license-report.json || true
        npx license-checker --failOn 'GPL;AGPL;LGPL' --summary || exit 1

    - uses: ./.github/actions/aws-configure
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload Security Reports to S3
      if: always()
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        case "${{ env.ENVIRONMENT }}" in
          dev) BUCKET="${{ secrets.SECURITY_REPORTS_BUCKET_DEV }}" ;;
          staging) BUCKET="${{ secrets.SECURITY_REPORTS_BUCKET_STAGING }}" ;;
          prod) BUCKET="${{ secrets.SECURITY_REPORTS_BUCKET_PROD }}" ;;
        esac
        
        [ -f "frontend/audit-results.json" ] && aws s3 cp frontend/audit-results.json s3://$BUCKET/frontend/${{ env.ENVIRONMENT }}/$TIMESTAMP/audit-results.json
        [ -f "frontend/license-report.json" ] && aws s3 cp frontend/license-report.json s3://$BUCKET/frontend/${{ env.ENVIRONMENT }}/$TIMESTAMP/license-report.json
        
        echo "{\"timestamp\":\"$TIMESTAMP\",\"environment\":\"${{ env.ENVIRONMENT }}\",\"repository\":\"frontend\",\"commit\":\"${{ env.COMMIT_SHA }}\",\"actor\":\"${{ github.actor }}\",\"workflow_run\":\"${{ github.run_id }}\"}" > scan-summary.json
        aws s3 cp scan-summary.json s3://$BUCKET/frontend/${{ env.ENVIRONMENT }}/$TIMESTAMP/scan-summary.json

    - name: Upload Security Reports (Artifacts)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ env.ENVIRONMENT }}
        path: |
          frontend/audit-results.json
          frontend/license-report.json
          scan-summary.json

  build-and-test:
    needs: security-scan
    if: always() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'failure')
    runs-on: [self-hosted, frontend]
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/checkout-frontend
      with:
        repository: ${{ env.FRONTEND_REPO }}
        ref: ${{ env.COMMIT_SHA }}
        token: ${{ secrets.FRONTEND_REPO_TOKEN }}

    - uses: ./.github/actions/setup-node

    - name: Set API URL
      id: api-config
      run: |
        case "${{ env.ENVIRONMENT }}" in
          dev) echo "api_url=${{ secrets.NG_APP_DEV_API }}" >> $GITHUB_OUTPUT ;;
          staging) echo "api_url=${{ secrets.NG_APP_DEV_API }}" >> $GITHUB_OUTPUT ;;
          prod) echo "api_url=${{ secrets.NG_APP_PROD_API }}" >> $GITHUB_OUTPUT ;;
        esac

    - uses: ./.github/actions/frontend-build
      with:
        environment: ${{ env.ENVIRONMENT }}
        api-url: ${{ steps.api-config.outputs.api_url }}
        google-maps-key: ${{ secrets.NG_APP_GOOGLE_MAPS_KEY }}

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ env.ENVIRONMENT }}
        path: frontend/dist/

  deploy-to-s3:
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'success'
    runs-on: [self-hosted, frontend]
    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ env.ENVIRONMENT }}
        path: dist/

    - uses: ./.github/actions/aws-configure
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get Deployment Config
      id: config
      run: |
        case "${{ env.ENVIRONMENT }}" in
          dev) 
            echo "bucket=${{ secrets.S3_BUCKET_DEV }}" >> $GITHUB_OUTPUT
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_DEV }}" >> $GITHUB_OUTPUT
            ;;
          staging) 
            echo "bucket=${{ secrets.S3_BUCKET_STAGING }}" >> $GITHUB_OUTPUT
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_STAGING }}" >> $GITHUB_OUTPUT
            ;;
          prod) 
            echo "bucket=${{ secrets.S3_BUCKET_PROD }}" >> $GITHUB_OUTPUT
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_PROD }}" >> $GITHUB_OUTPUT
            ;;
        esac

    - uses: ./.github/actions/s3-deploy
      with:
        bucket: ${{ steps.config.outputs.bucket }}
        distribution-id: ${{ steps.config.outputs.distribution }}

  notify:
    needs: [security-scan, build-and-test, deploy-to-s3]
    if: always()
    runs-on: [self-hosted, frontend]
    steps:
    - name: Slack Notification
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        status: custom
        custom_payload: |
          {
            "text": "Frontend Deployment ${{ contains(needs.*.result, 'failure') && 'Failed ❌' || 'Succeeded ✅' }}",
            "attachments": [{
              "color": "${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}",
              "fields": [
                {"title": "Environment", "value": "${{ env.ENVIRONMENT }}", "short": true},
                {"title": "Security Scan", "value": "${{ needs.security-scan.result }}", "short": true},
                {"title": "Triggered By", "value": "${{ github.actor }}", "short": true}
              ]
            }]
          }
