name: Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging]
    paths: ['terraform/**']
  pull_request:
    branches: [main, dev, staging]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

env:
  ENVIRONMENT: ${{ inputs.environment || (github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  ACTION: ${{ inputs.action || (github.event_name == 'pull_request' && 'plan' || 'apply') }}
  TF_VERSION: '1.13.4'
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}

jobs:
  validate:
    runs-on: [self-hosted, infrastructure]
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-terraform
      with:
        terraform-version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive terraform/
      continue-on-error: true

    - uses: ./.github/actions/aws-configure
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: ./.github/actions/terraform-init
      with:
        environment: ${{ env.ENVIRONMENT }}
        state-bucket: ${{ env.TF_STATE_BUCKET }}
        state-dynamodb-table: ${{ env.TF_STATE_DYNAMODB_TABLE }}
        aws-region: ${{ env.AWS_REGION }}
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Validate
      working-directory: terraform/environments/${{ env.ENVIRONMENT }}
      run: terraform validate
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Run TFLint
      working-directory: terraform/environments/${{ env.ENVIRONMENT }}
      run: |
        tflint --init
        tflint
      continue-on-error: true

  security-scan:
    needs: [validate]
    runs-on: [self-hosted, infrastructure]
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/terraform-security-scan

  plan:
    needs: [security-scan]
    if: (inputs.action == 'plan' || github.event_name == 'pull_request' || (github.event_name == 'push' && inputs.action != 'apply'))
    runs-on: [self-hosted, infrastructure]
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-terraform
      with:
        terraform-version: ${{ env.TF_VERSION }}

    - uses: ./.github/actions/aws-configure
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: ./.github/actions/terraform-init
      with:
        environment: ${{ env.ENVIRONMENT }}
        state-bucket: ${{ env.TF_STATE_BUCKET }}
        state-dynamodb-table: ${{ env.TF_STATE_DYNAMODB_TABLE }}
        aws-region: ${{ env.AWS_REGION }}
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_payment_service_url: ${{ secrets.PAYMENT_SERVICE_URL }}

    - uses: ./.github/actions/terraform-deploy
      with:
        environment: ${{ env.ENVIRONMENT }}
        action: plan
        state-bucket: ${{ env.TF_STATE_BUCKET }}
        aws-region: ${{ env.AWS_REGION }}
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_payment_service_url: ${{ secrets.PAYMENT_SERVICE_URL }}

    - name: Comment PR with Plan
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('terraform/environments/${{ env.ENVIRONMENT }}/plan.txt', 'utf8');
          const maxGitHubBodyCharacters = 65536;
          
          const planChunks = plan.match(/.{1,65536}/g) || [];
          
          for (let i = 0; i < planChunks.length; i++) {
            const output = `### Terraform Plan (${{ env.ENVIRONMENT }}) - Part ${i + 1}/${planChunks.length}\n\n\`\`\`terraform\n${planChunks[i]}\n\`\`\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
          }

    - name: Upload Plan Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ env.ENVIRONMENT }}-${{ github.sha }}
        path: |
          terraform/environments/${{ env.ENVIRONMENT }}/tfplan
          terraform/environments/${{ env.ENVIRONMENT }}/plan.txt
        retention-days: 30

  deploy:
    needs: [plan]
    if: (inputs.action == 'apply' || (github.event_name == 'push' && inputs.action != 'plan')) && github.event_name != 'pull_request'
    runs-on: [self-hosted, infrastructure]
    environment: ${{ (github.ref == 'refs/heads/main' || inputs.environment == 'prod') && 'production' || (github.ref == 'refs/heads/staging' || inputs.environment == 'staging') && 'staging' || 'development' }}
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-terraform
      with:
        terraform-version: ${{ env.TF_VERSION }}
        terraform-wrapper: false

    - uses: ./.github/actions/aws-configure
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: ./.github/actions/terraform-init
      with:
        environment: ${{ env.ENVIRONMENT }}
        state-bucket: ${{ env.TF_STATE_BUCKET }}
        state-dynamodb-table: ${{ env.TF_STATE_DYNAMODB_TABLE }}
        aws-region: ${{ env.AWS_REGION }}
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_payment_service_url: ${{ secrets.PAYMENT_SERVICE_URL }}

    - uses: ./.github/actions/terraform-deploy
      with:
        environment: ${{ env.ENVIRONMENT }}
        action: apply
        state-bucket: ${{ env.TF_STATE_BUCKET }}
        aws-region: ${{ env.AWS_REGION }}
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_payment_service_url: ${{ secrets.PAYMENT_SERVICE_URL }}

    - name: Upload State Backup
      uses: actions/upload-artifact@v4
      with:
        name: terraform-state-${{ env.ENVIRONMENT }}-${{ github.sha }}
        path: terraform/environments/${{ env.ENVIRONMENT }}/terraform.tfstate.backup
        retention-days: ${{ env.ENVIRONMENT == 'prod' && 365 || 90 }}

  notify:
    needs: [deploy]
    if: always()
    runs-on: [self-hosted, infrastructure]
    steps:
    - name: Slack Notification
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        status: custom
        custom_payload: |
          {
            "text": "Infrastructure ${{ (inputs.action == 'plan' || github.event_name == 'pull_request') && 'Plan' || 'Deployment' }} ${{ contains(needs.*.result, 'failure') && 'Failed ❌' || 'Succeeded ✅' }}",
            "attachments": [{
              "color": "${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}",
              "fields": [
                {"title": "Environment", "value": "${{ env.ENVIRONMENT }}", "short": true},
                {"title": "Action", "value": "${{ inputs.action || (github.event_name == 'pull_request' && 'plan' || 'apply') }}", "short": true},
                {"title": "Triggered By", "value": "${{ github.actor }}", "short": true}
              ]
            }]
          }